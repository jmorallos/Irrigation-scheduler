<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clear cache — Irrigation Scheduler</title>
    <meta http-equiv="Cache-Control" content="no-store" />
  </head>
  <body>
    <p>Clearing old service workers and caches…</p>
    <script>
      (async function () {
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
          document.body.innerHTML = '<p>Done. Redirecting…</p>';
          location.replace('/?nocache=' + Date.now());
        } catch (e) {
          document.body.innerHTML = '<p>Failed: ' + e + '</p><p><a href="/">Continue anyway</a></p>';
        }
      })();
    </script>
  </body>
</html>
